<div class="container favorites-page">
  <h1>Meine Favoriten</h1>

  @if (loading()) {
    <div class="loading">Wird geladen…</div>
  } @else if (favoritesService.favorites().length === 0) {
    <div class="empty-state">
      <p>Noch keine Favoriten gemerkt.</p>
      <p class="empty-hint">Tippe auf ♡ bei einem Buch, um es hier zu sammeln.</p>
      <a routerLink="/" class="btn btn-primary">Bücher entdecken</a>
    </div>
  } @else {
    <div class="book-grid">
      @for (book of favoritesService.favorites(); track book.id) {
        <app-book-card
          [book]="book"
          [isFavorite]="true"
          (addToCart)="onAddToCart($event)"
          (toggleFavorite)="onToggleFavorite($event)"
        />
      }
    </div>
  }
</div>
