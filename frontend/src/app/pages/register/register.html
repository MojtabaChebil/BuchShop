<div class="auth-page">
  <div class="auth-card">
    <h1>Konto erstellen</h1>
    <p class="auth-subtitle">Werde Teil unserer Lesegemeinschaft!</p>

    @if (errorMsg()) {
      <div class="alert alert-error">{{ errorMsg() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          id="name"
          type="text"
          class="form-input"
          [(ngModel)]="name"
          name="name"
          placeholder="Dein Name"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">E-Mail</label>
        <input
          id="email"
          type="email"
          class="form-input"
          [(ngModel)]="email"
          name="email"
          placeholder="deine@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Passwort</label>
        <input
          id="password"
          type="password"
          class="form-input"
          [(ngModel)]="password"
          name="password"
          placeholder="Mindestens 6 Zeichen"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Passwort bestätigen</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-input"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Wird erstellt…' : 'Konto erstellen' }}
      </button>
    </form>

    <p class="auth-footer">Bereits registriert? <a routerLink="/login">Jetzt anmelden</a></p>
  </div>
</div>
