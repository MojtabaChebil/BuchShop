<div class="auth-page">
  <div class="auth-card">
    <h1>Anmelden</h1>
    <p class="auth-subtitle">Schön, dich wiederzusehen!</p>

    @if (errorMsg()) {
      <div class="alert alert-error">{{ errorMsg() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input
          id="email"
          type="email"
          class="form-input"
          [(ngModel)]="email"
          name="email"
          placeholder="deine@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Passwort</label>
        <input
          id="password"
          type="password"
          class="form-input"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Wird angemeldet…' : 'Anmelden' }}
      </button>
    </form>

    <p class="auth-footer">Noch kein Konto? <a routerLink="/registrieren">Jetzt registrieren</a></p>
  </div>
</div>
