<header class="navbar">
  <div class="container navbar-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-mark">📚</span>
      <span class="brand-name">BuchShop</span>
    </a>

    <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Menü öffnen">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        Startseite
      </a>

      @if (authService.isLoggedIn()) {
        <a routerLink="/favoriten" routerLinkActive="active" (click)="closeMenu()">Favoriten</a>

        <a routerLink="/warenkorb" routerLinkActive="active" class="cart-link" (click)="closeMenu()">
          Warenkorb
          @if (cartService.itemCount() > 0) {
            <span class="badge">{{ cartService.itemCount() }}</span>
          }
        </a>

        <a routerLink="/konto" routerLinkActive="active" class="account-link" (click)="closeMenu()">
          {{ authService.currentUser()?.name }}
        </a>

        <button type="button" class="btn-logout" (click)="logout()">Abmelden</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
        <a routerLink="/registrieren" class="btn-register" (click)="closeMenu()">Registrieren</a>
      }
    </nav>
  </div>
</header>
