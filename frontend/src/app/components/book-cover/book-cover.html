<div class="book-cover" [style.background]="gradient()">

  <div class="cover-content">
    <span class="cover-category">{{ category() }}</span>
    <span class="cover-title">{{ title() }}</span>
    <span class="cover-author">{{ author() }}</span>
  </div>
  <div class="cover-sheen"></div>
</div>
